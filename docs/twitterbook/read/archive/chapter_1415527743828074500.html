    <script>
function copyTweetLink(el, anchor) {
  var url = window.location.origin + window.location.pathname + '#' + anchor;
  navigator.clipboard.writeText(url).then(function() {
    el.classList.add('copied');
    setTimeout(function() { el.classList.remove('copied'); }, 1200);
  });
  return false;
}
(function() {
  if (window.location.hash) {
    var id = window.location.hash.substring(1);
    var tweet = document.getElementById(id);
    if (tweet) {
      setTimeout(function() {
        var y = tweet.getBoundingClientRect().top + window.pageYOffset - 100;
        window.scrollTo({ top: y, behavior: 'smooth' });
        tweet.classList.add('permalink-highlight');
      }, 300);
    }
  }
})();
</script>
